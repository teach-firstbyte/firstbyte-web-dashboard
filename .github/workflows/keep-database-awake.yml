name: Keep database awake

# Supabase pauses Free plan projects after about 7 days of low database
# activity. A paused project takes the dashboard offline until someone clicks
# "Resume project" in Supabase. The risk is highest over breaks, when nobody
# logs in. Supabase's docs say a few database requests a day is usually enough
# to prevent pausing, so this job runs one small query every day against each
# project: production, and the preview project that Vercel preview
# deployments use.
#
# This is not a guarantee: only a paid Supabase plan promises never to pause.
# Supabase emails the project owner about a week before a pause, which leaves
# time to react if this stops being enough.
#
# Each ping logs in as `keepalive`, a Postgres role that has no access to any
# table, so the secrets cannot read or change data even if they leak. See
# "Keeping the database awake" in apps/dashboard/README.md for the setup.
#
# GitHub turns off scheduled workflows in public repositories after 60 days
# with no commits, and emails first. After a long break, turn it back on from
# Actions -> Keep database awake -> Enable workflow.

on:
  schedule:
    # 14:17 UTC every day. Off the hour on purpose: GitHub delays jobs
    # scheduled at :00, when most other scheduled jobs start.
    - cron: "17 14 * * *"
  # Lets you run it by hand to test it: Actions -> Keep database awake -> Run workflow.
  workflow_dispatch:

# The job reads no repository content and writes nothing back.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # One project failing must not stop the other's ping.
      fail-fast: false
      matrix:
        include:
          - database: production
            secret: KEEPALIVE_DATABASE_URL
          - database: preview
            secret: KEEPALIVE_PREVIEW_DATABASE_URL
    name: ping (${{ matrix.database }})
    env:
      # Repository secrets, not ones on the "Production database" or "Preview
      # database" environments: the production one needs a reviewer to
      # approve every run, which a daily job can't wait for. The role behind
      # each one has no data access.
      KEEPALIVE_DATABASE_URL: ${{ secrets[matrix.secret] }}
      PGCONNECT_TIMEOUT: "15"
    steps:
      - name: Check the secret is set
        run: |
          if [ -z "$KEEPALIVE_DATABASE_URL" ]; then
            echo "::error::Add the ${{ matrix.secret }} repository secret (Settings -> Secrets and variables -> Actions). See apps/dashboard/README.md."
            exit 1
          fi

      # ubuntu-latest ships the PostgreSQL client. Install it only if a future
      # runner image drops it.
      - name: Make sure psql is installed
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Run one query
        run: psql "$KEEPALIVE_DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --command "select now() as database_time"
