name: Database migrations

# Applies committed Prisma migrations to the production database with
# `prisma migrate deploy`, which only runs migration files that haven't run
# yet. It never creates migrations and never resets data, unlike
# `prisma migrate dev`, which is for local databases only.
#
# Runs on its own when a push to main changes a migration, and can be re-run
# by hand (Actions tab -> Database migrations -> Run workflow).
#
# The connection strings are secrets on the "Production database" GitHub
# environment (Settings -> Environments), which also requires a reviewer to
# approve each run. See apps/dashboard/README.md.

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/prisma/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: Production database
    # Never run two migrations against the database at once, and never cancel
    # one halfway.
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/dashboard
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Supabase's "Session pooler" string (port 5432 on *.pooler.supabase.com).
      # GitHub's runners have no IPv6, so the direct db.<ref>.supabase.co
      # address doesn't work here, and migrations can't run through the
      # transaction pooler on port 6543.
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4

      # Runs after checkout: the default working directory, apps/dashboard,
      # only exists once the repo is checked out.
      - name: Check the database secrets are set
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "::error::DATABASE_URL and DIRECT_URL must be secrets on the 'Production database' environment (Settings -> Environments)."
            exit 1
          fi

      # Same Node.js major version as Vercel's build (Project Settings -> Node.js
      # Version, 24.x). Change both together.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installs the whole workspace from the single root lockfile, so the
      # Prisma version matches the app's.
      - run: npm ci

      # Lists the migrations about to run. Exits non-zero when some are
      # pending, which is expected here, so that alone doesn't fail the job.
      - name: Show pending migrations
        run: npx prisma migrate status || true

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Fails the job if anything is still pending or failed.
      - name: Confirm the database is up to date
        run: npx prisma migrate status
