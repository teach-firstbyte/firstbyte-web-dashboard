<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-board Task Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the dashboard's own frame (pill nav, cream page, white rounded cards), with a dashed
   "mockup" bar above it to switch screens and who you are viewing as. */
:root {
  --bg: oklch(0.972 0.014 84);
  --fg: oklch(0.145 0.005 286);
  --card: oklch(1 0 0);
  --muted: oklch(0.945 0.012 84);
  --muted-fg: oklch(0.5 0.014 286);
  --border: oklch(0.905 0.014 84);
  --input: oklch(0.88 0.014 84);
  --primary: oklch(0.527 0.137 150);
  --primary-fg: oklch(0.99 0 0);
  --primary-tint: oklch(0.527 0.137 150 / 0.12);
  --warning: oklch(0.62 0.14 75);
  --warning-fg: oklch(0.42 0.1 70);
  --warning-tint: oklch(0.62 0.14 75 / 0.15);
  --danger: oklch(0.53 0.2 27);
  --danger-tint: oklch(0.577 0.245 27.3 / 0.1);
  --info: oklch(0.45 0.11 245);
  --info-tint: oklch(0.55 0.12 245 / 0.12);
  --ring: oklch(0.627 0.17 149);
  --shadow: 0 10px 34px oklch(0.25 0.03 84 / 0.14);
  --chat: oklch(0.985 0.006 84);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 0.75rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.147 0.004 49); --fg: oklch(0.961 0 0); --card: oklch(0.216 0.006 56);
    --muted: oklch(0.268 0.007 34); --muted-fg: oklch(0.705 0.015 286);
    --border: oklch(1 0 0 / 10%); --input: oklch(1 0 0 / 16%);
    --primary: oklch(0.723 0.192 150); --primary-fg: oklch(0.266 0.065 153); --primary-tint: oklch(0.723 0.192 150 / 0.15);
    --warning: oklch(0.75 0.15 80); --warning-fg: oklch(0.88 0.08 85); --warning-tint: oklch(0.75 0.15 80 / 0.16);
    --danger: oklch(0.74 0.16 22); --danger-tint: oklch(0.704 0.191 22.2 / 0.16);
    --info: oklch(0.8 0.09 245); --info-tint: oklch(0.7 0.12 245 / 0.16);
    --ring: oklch(0.6 0.15 150); --shadow: 0 10px 34px oklch(0 0 0 / 0.5); --chat: oklch(0.19 0.005 56);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.147 0.004 49); --fg: oklch(0.961 0 0); --card: oklch(0.216 0.006 56);
  --muted: oklch(0.268 0.007 34); --muted-fg: oklch(0.705 0.015 286);
  --border: oklch(1 0 0 / 10%); --input: oklch(1 0 0 / 16%);
  --primary: oklch(0.723 0.192 150); --primary-fg: oklch(0.266 0.065 153); --primary-tint: oklch(0.723 0.192 150 / 0.15);
  --warning: oklch(0.75 0.15 80); --warning-fg: oklch(0.88 0.08 85); --warning-tint: oklch(0.75 0.15 80 / 0.16);
  --danger: oklch(0.74 0.16 22); --danger-tint: oklch(0.704 0.191 22.2 / 0.16);
  --info: oklch(0.8 0.09 245); --info-tint: oklch(0.7 0.12 245 / 0.16);
  --ring: oklch(0.6 0.15 150); --shadow: 0 10px 34px oklch(0 0 0 / 0.5); --chat: oklch(0.19 0.005 56);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  background-image: radial-gradient(60rem 20rem at 15% -6rem, color-mix(in oklch, var(--primary) 16%, transparent), transparent 70%);
  background-repeat: no-repeat;
  color: var(--fg);
  font: 14px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 48px;
}
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }

/* ---------- Mockup bar ---------- */
.proto {
  border: 1.5px dashed var(--input);
  border-radius: 14px;
  padding: 10px 12px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  background: color-mix(in oklch, var(--card) 60%, transparent);
}
.proto-tag { font: 600 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-fg); }
.proto-tabs { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto; min-width: 0; }
.proto-tabs a {
  text-decoration: none; padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--muted-fg);
}
.proto-tabs a:hover { color: var(--fg); background: var(--muted); }
.proto-tabs a[aria-current="page"] { background: var(--fg); color: var(--bg); }
.proto-side { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.proto-side label { font-size: 12px; color: var(--muted-fg); }
.proto select, .linkbtn {
  border: 1px solid var(--input); background: var(--card); border-radius: 8px; padding: 5px 8px; font-size: 13px;
}
.linkbtn { cursor: pointer; color: var(--muted-fg); }
.linkbtn:hover { color: var(--fg); }

/* ---------- Dashboard chrome ---------- */
.nav {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 20;
  display: flex; align-items: center; gap: 8px;
  border: 1px solid color-mix(in oklch, var(--border) 70%, transparent); border-radius: 999px;
  background: color-mix(in oklch, var(--bg) 85%, transparent); backdrop-filter: blur(14px);
  padding: 6px 8px 6px 16px; box-shadow: 0 4px 14px oklch(0.2 0.02 84 / 0.08);
}
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; flex-shrink: 0; }
.logo-mark { width: 24px; height: 24px; border-radius: 7px; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; font: 700 11px/1 var(--mono); }
.nav ul { display: flex; gap: 2px; list-style: none; margin: 0; padding: 0; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav a { position: relative; display: block; padding: 8px 12px; border-radius: 999px; text-decoration: none; font-weight: 500; white-space: nowrap; color: color-mix(in oklch, var(--fg) 75%, transparent); }
.nav a:hover { color: var(--primary); }
.nav a[aria-disabled="true"] { cursor: default; }
.nav a[aria-disabled="true"]:hover { color: color-mix(in oklch, var(--fg) 75%, transparent); }
.nav a[aria-current="page"] { color: var(--primary); }
.nav a[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 2px; border-radius: 2px; background: var(--primary); }
.me { flex-shrink: 0; }

main { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); min-width: 0; }
footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; border-top: 1px solid var(--border); padding-top: 16px; font-size: 12px; color: var(--muted-fg); }

.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding-top: 8px; }
.page-head h1 { font-size: clamp(1.6rem, 3vw, 2rem); font-weight: 700; letter-spacing: -0.02em; }
.page-head .desc { color: var(--muted-fg); font-size: 15px; margin-top: 4px; }
.eyebrow { font-size: 12px; font-weight: 600; color: var(--muted-fg); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }

.section { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.ghost { opacity: 0.55; }
.caption { font-size: 12px; color: var(--muted-fg); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 8px 14px; font-weight: 600; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
.btn-primary { background: var(--primary); color: var(--primary-fg); }
.btn-primary:hover { background: color-mix(in oklch, var(--primary) 90%, var(--fg)); }
.btn-outline { background: var(--card); border-color: var(--input); }
.btn-outline:hover { background: var(--muted); }
.btn-danger { background: var(--danger); color: oklch(0.99 0 0); }
.btn-quiet { background: transparent; color: var(--muted-fg); padding: 6px 8px; }
.btn-quiet:hover { color: var(--fg); background: var(--muted); }
.btn-sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.textlink { color: var(--primary); font-weight: 500; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
.textlink:hover { text-decoration: underline; }

.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.badge-warn { background: var(--warning-tint); color: var(--warning-fg); }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 500; background: var(--muted); color: var(--muted-fg); white-space: nowrap; }
.chip.quiet { background: transparent; border: 1px solid var(--border); }
.chip.warn { background: var(--warning-tint); color: var(--warning-fg); }
.chip svg { width: 12px; height: 12px; flex-shrink: 0; }

.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--primary-tint); color: var(--primary); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.avatar.sm { width: 22px; height: 22px; font-size: 10px; }
.avatar.gone { background: var(--warning-tint); color: var(--warning-fg); }

/* ---------- Board ---------- */
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15px; color: var(--muted-fg); margin-top: 4px; }
.stats b { color: var(--fg); font-variant-numeric: tabular-nums; }
.stats .hot b { color: var(--danger); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--muted); }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted-fg); }
.seg button[aria-checked="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px oklch(0 0 0 / 0.1); }
.toggle { border: 1px solid var(--input); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted-fg); }
.toggle[aria-pressed="true"] { background: var(--primary-tint); border-color: transparent; color: var(--primary); }

.groups { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.group { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; min-width: 0; }
.group.attn { border-color: color-mix(in oklch, var(--warning) 45%, var(--border)); }
.group-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; flex-wrap: wrap; }
.group-name { display: flex; flex-direction: column; min-width: 0; flex: 1 1 160px; }
.group-name b { font-size: 15px; }
.group-name span { font-size: 12px; color: var(--muted-fg); }
.group-counts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
.group-counts .over { color: var(--danger); font-weight: 600; }
.group-empty { padding: 0 18px 14px 58px; color: var(--muted-fg); font-size: 13px; }

.tasks { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
.task { display: grid; grid-template-columns: 124px minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; padding: 11px 18px; border-bottom: 1px solid var(--border); }
.task:last-child { border-bottom: 0; }
.task.is-done .task-title { color: var(--muted-fg); text-decoration: line-through; text-decoration-color: color-mix(in oklch, var(--muted-fg) 60%, transparent); }
.task.fresh { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--primary-tint); } to { background: transparent; } }
.task-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.task-title { text-align: left; background: none; border: 0; padding: 0; cursor: pointer; font-weight: 500; font-size: 14.5px; color: var(--fg); overflow-wrap: anywhere; }
.task-title:hover { color: var(--primary); }
.task-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.note { font-size: 12px; color: var(--muted-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; min-width: 0; }
.task-due { font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--muted-fg); font-variant-numeric: tabular-nums; padding-top: 3px; text-align: right; }
.task-due.overdue { color: var(--danger); font-weight: 600; }
.task-due.today { color: var(--warning-fg); font-weight: 600; }
.task-due.soon { color: var(--fg); }

.status { appearance: none; -webkit-appearance: none; border: 1px solid transparent; border-radius: 999px; padding: 3px 26px 3px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; width: 100%;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right 12px top 55%, right 8px top 55%; background-size: 4px 4px; background-repeat: no-repeat; }
.status-pill { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; }
.s-todo { background-color: var(--muted); color: var(--fg); }
.s-doing { background-color: var(--info-tint); color: var(--info); }
.s-done { background-color: var(--primary-tint); color: var(--primary); }

.notice { border-radius: 14px; padding: 16px 18px; background: var(--card); border: 1px solid var(--border); display: grid; gap: 6px; }
.notice b { font-size: 15px; }

/* ---------- Meeting ---------- */
.meeting-grid { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
.entry { --fs: 15px; font-size: var(--fs); }
.entry.big { --fs: 20px; }
.entry-row { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.2fr) minmax(0, 1.1fr) auto; gap: 8px; align-items: start; }
.field { position: relative; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--input); background: var(--card); border-radius: 10px; padding: 0.55em 0.75em; font-size: inherit; min-width: 0;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--ring); outline-offset: 0; border-color: transparent; }
.field input[aria-invalid="true"] { border-color: var(--danger); }
.field .hint { font-size: 12px; color: var(--muted-fg); min-height: 1.3em; }
.field .hint.ok { color: var(--primary); font-weight: 500; }
.field .hint.bad { color: var(--danger); }
.entry .btn { font-size: inherit; padding: 0.55em 1em; }
.entry-help { font-size: 12.5px; color: var(--muted-fg); display: flex; flex-wrap: wrap; gap: 4px 14px; }
kbd { font: 600 11px/1 var(--mono); border: 1px solid var(--input); border-bottom-width: 2px; border-radius: 5px; padding: 2px 5px; background: var(--card); color: var(--fg); }

.menu { position: absolute; top: calc(100% - 1.2em); left: 0; right: 0; z-index: 30; list-style: none; margin: 0; padding: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); max-height: 280px; overflow-y: auto; font-size: 14px; min-width: 220px; }
.menu li { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.menu li[aria-selected="true"] { background: var(--muted); }
.menu li span { color: var(--muted-fg); font-size: 12px; margin-left: auto; text-align: right; }

.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.2fr) minmax(0, 1.1fr) auto; gap: 8px; align-items: center; padding: 0.55em 0.2em; border-bottom: 1px solid var(--border); }
.item:last-child { border-bottom: 0; }
.item.fresh { animation: flash 1.6s ease-out; }
.item .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.item .who b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .task-title { font-size: inherit; }
.item .task-due { padding: 0; text-align: left; font-size: 0.9em; }
.empty { padding: 18px; text-align: center; color: var(--muted-fg); border: 1px dashed var(--input); border-radius: 12px; }
.empty b { color: var(--fg); display: block; margin-bottom: 2px; }

/* ---------- Home ---------- */
.home-grid { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.rows li:last-child { border-bottom: 0; }
.rows .task-due { padding: 0; }
.meet-row { display: flex; flex-direction: column; gap: 2px; }
.meet-row span { font-size: 12px; color: var(--muted-fg); }

/* ---------- Slack DMs ---------- */
.dms { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.dm { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.dm-when { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted-fg); }
.dm-when b { color: var(--fg); font-weight: 600; }
.msg { background: var(--chat); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; }
.bot { width: 36px; height: 36px; border-radius: 8px; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; font: 700 12px/1 var(--mono); }
.msg-head { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.msg-head b { font-size: 14.5px; }
.app-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; background: var(--muted); color: var(--muted-fg); border-radius: 4px; padding: 1px 4px; }
.msg-head time { font-size: 12px; color: var(--muted-fg); }
.msg-body { display: grid; gap: 6px; font-size: 14.5px; line-height: 1.5; overflow-wrap: anywhere; min-width: 0; }
.msg-body .sub { color: var(--muted-fg); font-size: 13.5px; }
.msg-body ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.msg-body .lbl { font-weight: 700; margin-top: 4px; }
.msg-link { color: var(--info); font-weight: 500; }
.dm.wide { grid-column: 1 / -1; }

/* ---------- Setup ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted-fg); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.person { display: flex; align-items: center; gap: 10px; min-width: 180px; }
.person div { display: flex; flex-direction: column; }
.person span { font-size: 12px; color: var(--muted-fg); }
code { font: 500 12.5px/1 var(--mono); background: var(--muted); padding: 3px 6px; border-radius: 6px; }
.link-edit { display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; }
.link-edit .field { width: 200px; }
.link-edit input { padding: 6px 9px; font-size: 13px; font-family: var(--mono); }
.settings-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.settings-row .field { width: 170px; font-size: 14px; }
.settings-row label { font-size: 12px; font-weight: 600; color: var(--muted-fg); }

/* ---------- Sheet ---------- */
dialog.sheet {
  margin: 0 0 0 auto; border: 0; padding: 0; width: min(460px, 100%); height: 100%; max-height: none; max-width: 100%;
  background: var(--card); color: var(--fg); box-shadow: var(--shadow); border-left: 1px solid var(--border);
}
dialog.sheet::backdrop { background: oklch(0.2 0.01 84 / 0.35); }
.sheet-inner { display: flex; flex-direction: column; height: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 20px 6px; }
.sheet-head h2 { font-size: 17px; }
.sheet-body { flex: 1; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 14px; font-size: 14px; }
.sheet-body label { font-size: 12px; font-weight: 600; color: var(--muted-fg); }
.sheet-body textarea { min-height: 80px; resize: vertical; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.perm { font-size: 13px; color: var(--muted-fg); background: var(--muted); border-radius: 10px; padding: 10px 12px; }
.readonly-val { padding: 0.55em 0; font-weight: 500; }
.sheet-foot { display: flex; gap: 8px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.sheet-foot .grow { flex: 1; }
.confirm { display: flex; flex-direction: column; gap: 10px; width: 100%; }

/* ---------- Toast ---------- */
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 60; display: grid; gap: 8px; width: min(440px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--fg); color: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; box-shadow: var(--shadow); display: grid; gap: 3px; animation: up 0.2s ease-out; }
.toast small { opacity: 0.75; font-size: 12.5px; }
@keyframes up { from { transform: translateY(8px); opacity: 0; } }

@media (max-width: 860px) {
  .home-grid, .dms { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .entry-row { grid-template-columns: minmax(0, 1fr); }
  .item { grid-template-columns: minmax(0, 1fr) auto; }
  .item .who, .item .task-due { grid-column: 1; }
  .item > :last-child { grid-column: 2; grid-row: 1; }
}
@media (max-width: 560px) {
  .task { grid-template-columns: minmax(0, 1fr); padding: 12px 14px; }
  .task-status { max-width: 140px; }
  .task-due { text-align: left; padding: 0; }
  .group-head { padding: 12px 14px; }
  .group-empty { padding: 0 14px 12px; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .nav { padding-left: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .task.fresh, .item.fresh, .toast { animation: none; }
}

<script>
(() => {
  "use strict";

  /* ---------- Dates ---------- */
  const DAY = 86400000;
  const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const fromIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const daysFromToday = s => Math.round((fromIso(s) - TODAY) / DAY);
  const fmtLong = d => d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  const fmtShort = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const fmtWeekday = d => d.toLocaleDateString("en-US", { weekday: "short" });
  const rel = d => (fmtLong(TODAY) === fmtLong(d) ? "today" : "");

  const FULL_WD = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
  const MONTHS = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
  function wdIndex(w) {
    if (w === "tues") return 2;
    if (w === "thur" || w === "thurs") return 4;
    if (w.length < 2) return -1;
    return FULL_WD.findIndex(f => f.startsWith(w));
  }
  function monthIndex(w) { return w.length < 3 ? -1 : MONTHS.findIndex(m => m.startsWith(w)); }
  function nextMonthDay(mo, da) {
    let d = new Date(TODAY.getFullYear(), mo, da);
    if (d.getMonth() !== mo) return null;
    if (d < TODAY) d = new Date(TODAY.getFullYear() + 1, mo, da);
    return d;
  }

  /** Reads what people type in a meeting: "fri", "next week", "12/4", "+3d", "nov 30", "30". */
  function parseDue(raw) {
    const s = raw.trim().toLowerCase().replace(/\s+/g, " ").replace(/^due /, "");
    if (!s) return null;
    let m;
    if (["today", "tod", "tdy", "tonight", "eod"].includes(s)) return TODAY;
    if (["tomorrow", "tmrw", "tmr", "tom", "tmw"].includes(s)) return addDays(TODAY, 1);
    if ((m = s.match(/^(?:\+|in )?(\d{1,3}) ?(?:d|day|days)$/))) return addDays(TODAY, +m[1]);
    if ((m = s.match(/^(?:\+|in )?(\d{1,2}) ?(?:w|wk|wks|week|weeks)$/))) return addDays(TODAY, 7 * m[1]);
    if (["next week", "nw", "in a week", "a week"].includes(s)) return addDays(TODAY, 7);
    if (["eow", "end of week", "this week"].includes(s)) return addDays(TODAY, (5 - TODAY.getDay() + 7) % 7);
    if ((m = s.match(/^(next |this )?([a-z]+)\.?$/))) {
      const i = wdIndex(m[2]);
      if (i >= 0) {
        let d = (i - TODAY.getDay() + 7) % 7;
        // "tue" and "next tue" both mean the coming Tuesday. The hint under the
        // field shows the exact date, so the room can correct it on the spot.
        if (d === 0) d = 7;
        return addDays(TODAY, d);
      }
    }
    if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?$/))) {
      const mo = +m[1] - 1, da = +m[2];
      if (m[3]) {
        const y = +m[3] < 100 ? 2000 + +m[3] : +m[3];
        const d = new Date(y, mo, da);
        return d.getMonth() === mo ? d : null;
      }
      return nextMonthDay(mo, da);
    }
    if ((m = s.match(/^([a-z]+)\.? (\d{1,2})(?:st|nd|rd|th)?$/))) { const mo = monthIndex(m[1]); if (mo >= 0) return nextMonthDay(mo, +m[2]); }
    if ((m = s.match(/^(\d{1,2})(?:st|nd|rd|th)? ([a-z]+)\.?$/))) { const mo = monthIndex(m[2]); if (mo >= 0) return nextMonthDay(mo, +m[1]); }
    if ((m = s.match(/^(?:the )?(\d{1,2})(?:st|nd|rd|th)?$/))) {
      const da = +m[1];
      if (da < 1 || da > 31) return null;
      let d = new Date(TODAY.getFullYear(), TODAY.getMonth(), da);
      if (d.getDate() !== da) return null;
      if (d < TODAY) { d = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, da); if (d.getDate() !== da) return null; }
      return d;
    }
    return null;
  }
  function inWords(d) {
    const n = Math.round((d - TODAY) / DAY);
    if (n === 0) return "today";
    if (n === 1) return "tomorrow";
    if (n === -1) return "yesterday";
    return n > 0 ? `in ${n} days` : `${-n} days ago`;
  }

  /* ---------- People and teams (sample) ---------- */
  const PEOPLE = [
    { id: "maya", name: "Maya Okafor", role: "President", superAdmin: true, eboard: true },
    { id: "daniel", name: "Daniel Reyes", role: "Vice president", superAdmin: true, eboard: true },
    { id: "sam", name: "Sam Patel", role: "Website lead", team: "web", superAdmin: true, eboard: true },
    { id: "priya", name: "Priya Nair", role: "Events lead", team: "events", eboard: true },
    { id: "jordan", name: "Jordan Lee", role: "CS Curricula lead", team: "cs", eboard: true },
    { id: "alex", name: "Alex Kim", role: "STEM Curricula lead", team: "stem", eboard: true },
    { id: "riley", name: "Riley Chen", role: "Brand & Marketing lead", team: "brand", eboard: true },
    { id: "taylor", name: "Taylor Brooks", role: "Treasurer", eboard: true },
    { id: "chris", name: "Chris Morgan", role: "Left the e-board", former: true },
    { id: "casey", name: "Casey Rivera", role: "Club member", team: "cs" },
  ];
  const TEAMS = [
    { id: "web", name: "Website Dev" }, { id: "cs", name: "CS Curricula" }, { id: "stem", name: "STEM Curricula" },
    { id: "events", name: "Events" }, { id: "brand", name: "Brand & Marketing" },
  ];
  const MEETINGS = [
    { id: "m0", label: "E-board meeting", when: TODAY, time: "7:00 PM", room: "Richards 235" },
    { id: "m1", label: "E-board meeting", when: addDays(TODAY, -7), time: "7:00 PM", room: "Richards 235" },
    { id: "m2", label: "E-board meeting", when: addDays(TODAY, -14), time: "7:00 PM", room: "Richards 235" },
  ];
  const person = id => PEOPLE.find(p => p.id === id);
  const first = p => p.name.split(" ")[0];
  const teamName = id => (TEAMS.find(t => t.id === id) || {}).name || "";
  const meeting = id => MEETINGS.find(m => m.id === id);
  const meetingShort = m => (m.id === "m0" ? "today's meeting" : `${fmtShort(m.when)} meeting`);
  const initials = name => name.split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const EBOARD = PEOPLE.filter(p => p.eboard);
  const SUPERS = PEOPLE.filter(p => p.superAdmin);

  function seed() {
    let n = 0;
    const t = (title, ownerId, due, status, extra = {}) => ({
      id: "t" + ++n, title, ownerId, due: iso(addDays(TODAY, due)), status,
      teamId: extra.team ?? (person(ownerId).team || null), meetingId: extra.meeting ?? "m1",
      notes: extra.notes || "", creatorId: extra.creator || "maya", undelivered: !!extra.undelivered, order: n,
    });
    return {
      v: 1,
      tasks: [
        t("Book Curry 340 for the December GBM", "priya", 2, "doing", { notes: "Ask for the room with the projector" }),
        t("Send sponsor follow-up to Wayfair", "daniel", -3, "todo", { meeting: "m2" }),
        t("Finalize the intro to Python workshop slides", "jordan", 5, "doing"),
        t("Order FirstBites snacks (budget $120)", "taylor", 0, "todo"),
        t("Post the December GBM flyer on Instagram", "riley", 6, "todo", { creator: "priya" }),
        t("Fix the check-in QR code timing out", "sam", 9, "doing", { meeting: null }),
        t("Draft the spring recruitment timeline", "maya", 14, "todo"),
        t("Confirm the guest speaker for the December GBM", "maya", 3, "doing", { notes: "Waiting on her reply" }),
        t("Count robotics kits after the STEM workshop", "alex", -1, "doing", { undelivered: true }),
        t("Email Boston Latin about a January visit", "chris", 4, "todo", { meeting: "m2", team: "stem" }),
        t("Reimburse November FirstBites receipts", "taylor", -8, "done", { meeting: "m2" }),
        t("Update the e-board photo on the website", "sam", -5, "done", { meeting: "m2" }),
        t("Confirm three judges for hack night", "priya", 11, "todo"),
        t("Book a room for the Python workshop", "jordan", 3, "todo", { team: "cs", creator: "jordan" }),
        t("Get reimbursement form signed by advisor", "taylor", 1, "doing"),
      ],
      slack: { maya: "U07MAYA0K1", daniel: "U07DRY3S22", sam: "U07SPTL903", priya: "U07PNAIR44", jordan: "U07JLEE555", alex: "U07AKIM066", taylor: "U07TBRK077" },
      summary: { day: 1, hour: 9 },
      next: n + 1,
    };
  }

  /* ---------- State (kept in this browser only) ---------- */
  const KEY = "fb-eboard-tasks-mockup-v1";
  const UIKEY = "fb-eboard-tasks-mockup-ui-v1";
  let state, ui;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch { state = null; }
  if (!state || state.v !== 1 || !Array.isArray(state.tasks)) state = seed();
  try { ui = JSON.parse(localStorage.getItem(UIKEY)); } catch { ui = null; }
  ui = Object.assign({ viewer: "maya", groupBy: "person", mine: false, showDone: false, big: false }, ui || {});
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); localStorage.setItem(UIKEY, JSON.stringify(ui)); } catch {} };

  const viewer = () => person(ui.viewer);
  const canUseTasks = v => !!(v.eboard || v.superAdmin);
  const canEditDetails = (v, t) => !!(v.superAdmin || t.creatorId === v.id);
  const canChangeStatus = (v, t) => t.ownerId === v.id || canEditDetails(v, t);
  const linked = id => !!state.slack[id];

  /* ---------- Small helpers ---------- */
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const WARN = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.5 15 14H1L8 1.5Zm-.75 4.5v4h1.5V6h-1.5Zm0 5.25v1.5h1.5v-1.5h-1.5Z"/></svg>';
  const STATUS = { todo: "To do", doing: "In progress", done: "Done" };
  const $ = sel => document.querySelector(sel);
  let freshId = null;

  function dueInfo(t) {
    const d = fromIso(t.due), n = daysFromToday(t.due);
    if (t.status === "done") return { text: `Due ${fmtShort(d)}`, cls: "" };
    if (n < 0) return { text: `${-n} ${n === -1 ? "day" : "days"} overdue`, cls: "overdue" };
    if (n === 0) return { text: "Due today", cls: "today" };
    if (n === 1) return { text: "Due tomorrow", cls: "soon" };
    if (n < 7) return { text: `Due ${fmtWeekday(d)}`, cls: "soon" };
    return { text: `Due ${fmtShort(d)}`, cls: "" };
  }
  const isOverdue = t => t.status !== "done" && daysFromToday(t.due) < 0;
  const dueThisWeek = t => t.status !== "done" && daysFromToday(t.due) >= 0 && daysFromToday(t.due) < 7;
  const needsOwner = t => t.status !== "done" && person(t.ownerId).former;
  const byDue = (a, b) => (a.status === "done") - (b.status === "done") || a.due.localeCompare(b.due) || a.order - b.order;

  function statusControl(t, can, label) {
    if (!can) return `<span class="status-pill s-${t.status}" title="Only ${esc(first(person(t.ownerId)))} or the creator can change this">${STATUS[t.status]}</span>`;
    return `<select class="status s-${t.status}" data-action="status" data-id="${t.id}" aria-label="Status of ${esc(label || t.title)}">
      ${Object.entries(STATUS).map(([k, v]) => `<option value="${k}"${k === t.status ? " selected" : ""}>${v}</option>`).join("")}
    </select>`;
  }
  function ownerChip(p) {
    return `<span class="chip"><span class="avatar sm${p.former ? " gone" : ""}">${initials(p.name)}</span>${esc(p.name)}</span>`;
  }
  function taskRow(t, opt = {}) {
    const v = viewer(), o = person(t.ownerId), d = dueInfo(t), m = t.meetingId ? meeting(t.meetingId) : null;
    return `<li class="task${t.status === "done" ? " is-done" : ""}${freshId === t.id ? " fresh" : ""}">
      <div class="task-status">${statusControl(t, canChangeStatus(v, t))}</div>
      <div class="task-main">
        <button class="task-title" data-action="open" data-id="${t.id}">${esc(t.title)}</button>
        <div class="task-meta">
          ${opt.showOwner ? ownerChip(o) : ""}
          ${needsOwner(t) ? `<span class="chip warn">${WARN}Needs a new owner</span>` : ""}
          ${t.teamId && opt.showTeam !== false ? `<span class="chip">${esc(teamName(t.teamId))}</span>` : ""}
          ${m ? `<span class="chip quiet">From ${esc(meetingShort(m))}</span>` : ""}
          ${t.undelivered && t.status !== "done" ? `<span class="chip warn" title="Slack didn't accept the reminder after a day of retries">${WARN}Reminder not delivered</span>` : ""}
          ${t.notes ? `<span class="note" title="${esc(t.notes)}">${esc(t.notes)}</span>` : ""}
        </div>
      </div>
      <div class="task-due ${d.cls}" title="${esc(fmtLong(fromIso(t.due)))}">${d.text}</div>
    </li>`;
  }

  /* ---------- Toast ---------- */
  function toast(title, lines = []) {
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = `<span>${esc(title)}</span>${lines.map(l => `<small>${esc(l)}</small>`).join("")}`;
    $("#toast").appendChild(el);
    setTimeout(() => el.remove(), 5200);
  }
  const dm = (id, what) => linked(id) ? `${first(person(id))} gets a Slack DM: ${what}.` : `${first(person(id))} isn't connected to Slack, so no DM goes out.`;

  /* ---------- Chrome ---------- */
  function renderChrome(route) {
    const v = viewer();
    const officerish = canUseTasks(v);
    const links = officerish
      ? [["#home", "Home", "home"], ["#meeting", "Meetings", "meeting"], ["", "Attendance"], ["", "Members"], ["", "Teams"], ["", "Feedback"], ["#board", "Tasks", "board"]]
      : [["#home", "Home", "home"], ["#meeting", "Meetings", "meeting"], ["", "My attendance"]];
    $("#navlinks").innerHTML = links.map(([href, label, r]) => href
      ? `<li><a href="${href}"${r === route || (r === "board" && route === "setup") ? ' aria-current="page"' : ""}>${label}</a></li>`
      : `<li><a aria-disabled="true" title="Not part of this mockup">${label}</a></li>`).join("");
    $("#me").textContent = initials(v.name);
    $("#me").title = v.name;
    document.querySelectorAll(".proto-tabs a").forEach(a => {
      if (a.dataset.route === route) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    $("#viewer").value = ui.viewer;
  }

  function noAccess(where) {
    const v = viewer();
    return `<div class="notice"><b>${esc(where)} is for the e-board only.</b>
      <p class="caption">${esc(v.name)} isn't on the e-board, so in the real dashboard there's no Tasks link and this page sends them back to Home. Switch "Viewing as" above to see it.</p></div>`;
  }

  /* ---------- Board ---------- */
  function renderBoard() {
    const v = viewer();
    if (!canUseTasks(v)) return noAccess("Tasks");
    const open = state.tasks.filter(t => t.status !== "done");
    const over = open.filter(isOverdue).length, week = open.filter(dueThisWeek).length, orphan = open.filter(needsOwner).length;
    let ts = state.tasks.filter(t => ui.showDone || t.status !== "done");
    if (ui.mine) ts = ts.filter(t => t.ownerId === v.id);
    ts.sort(byDue);

    let groups = [];
    if (ui.groupBy === "person") {
      const orphans = ts.filter(t => person(t.ownerId).former);
      if (orphans.length && !ui.mine) groups.push({ attn: true, head: `<span class="avatar gone">${WARN.replace('aria-hidden="true"', 'aria-hidden="true" width="14" height="14"')}</span><div class="group-name"><b>Needs a new owner</b><span>The owner left the e-board. Reminders are paused until it's reassigned.</span></div>`, tasks: orphans, showOwner: true });
      const people = ui.mine ? [v] : EBOARD;
      for (const p of people) {
        const mine = ts.filter(t => t.ownerId === p.id);
        groups.push({ person: p, tasks: mine });
      }
    } else {
      for (const tm of [...TEAMS, { id: null, name: "No team" }]) {
        const mine = ts.filter(t => (t.teamId || null) === tm.id);
        if (mine.length) groups.push({ head: `<div class="group-name"><b>${esc(tm.name)}</b><span>${tm.id ? "Team label" : "Tasks with no team label"}</span></div>`, tasks: mine, showOwner: true, showTeam: false });
      }
    }

    const groupHtml = groups.map(g => {
      const openN = g.tasks.filter(t => t.status !== "done").length, overN = g.tasks.filter(isOverdue).length;
      let head = g.head;
      if (g.person) {
        const p = g.person;
        head = `<span class="avatar">${initials(p.name)}</span>
          <div class="group-name"><b>${esc(p.name)}${p.id === v.id ? " (you)" : ""}</b><span>${esc(p.role)}</span></div>`
          + (linked(p.id) ? "" : `<span class="chip warn" title="Hector hasn't linked their Slack account yet">${WARN}Not connected to Slack: won't get reminders</span>`);
      }
      const counts = `<div class="group-counts">${overN ? `<span class="over">${overN} overdue</span><span aria-hidden="true">·</span>` : ""}<span>${openN} open</span></div>`;
      const body = g.tasks.length
        ? `<ul class="tasks">${g.tasks.map(t => taskRow(t, { showOwner: g.showOwner, showTeam: g.showTeam })).join("")}</ul>`
        : `<p class="group-empty">Nothing open.</p>`;
      return `<section class="group${g.attn ? " attn" : ""}"><div class="group-head">${head}${counts}</div>${body}</section>`;
    }).join("");

    const anything = groups.some(g => g.tasks.length);
    return `
      <header class="page-head">
        <div>
          <h1>Tasks</h1>
          <div class="stats">
            <span><b>${open.length}</b> open</span>
            <span class="${over ? "hot" : ""}"><b>${over}</b> overdue</span>
            <span><b>${week}</b> due this week</span>
            ${orphan ? `<span><b>${orphan}</b> need a new owner</span>` : ""}
          </div>
        </div>
        <button class="btn btn-primary" data-action="new">New task</button>
      </header>
      <div class="toolbar">
        <div class="seg" role="radiogroup" aria-label="Group by">
          <button role="radio" aria-checked="${ui.groupBy === "person"}" data-action="group" data-v="person">By person</button>
          <button role="radio" aria-checked="${ui.groupBy === "team"}" data-action="group" data-v="team">By team</button>
        </div>
        <button class="toggle" aria-pressed="${ui.mine}" data-action="mine">Only mine</button>
        <button class="toggle" aria-pressed="${ui.showDone}" data-action="done">Show done</button>
        ${v.superAdmin ? `<a class="textlink" href="#setup" style="margin-left:auto">Slack setup →</a>` : ""}
      </div>
      ${anything || ui.groupBy === "person" ? `<div class="groups">${groupHtml}</div>`
        : `<div class="empty"><b>No open tasks.</b>Add one from an e-board meeting or with New task.</div>`}`;
  }

  /* ---------- Meeting ---------- */
  function renderMeeting() {
    const v = viewer(), m = MEETINGS[0];
    if (!canUseTasks(v)) return noAccess("The e-board meeting page");

  function wireEntry() {
    const form = $("#entry");
    if (!form) return;
    const title = $("#e-title"), owner = $("#e-owner"), due = $("#e-due"), menu = $("#owner-menu");
    let matches = [], hi = 0, ownerId = null;

    const candidates = q => {
      q = q.trim().toLowerCase();
      if (!q) return EBOARD;
      return EBOARD.filter(p => p.name.toLowerCase().split(" ").some(w => w.startsWith(q)) || p.name.toLowerCase().startsWith(q)
        || p.role.toLowerCase().split(/[\s&]+/).some(w => w && w.startsWith(q)));
    };
    const drawMenu = () => {
      const open = matches.length > 0 && document.activeElement === owner;
      menu.hidden = !open;
      owner.setAttribute("aria-expanded", String(open));
      menu.innerHTML = matches.map((p, i) => `<li role="option" id="opt-${p.id}" data-id="${p.id}" aria-selected="${i === hi}">
        <span class="avatar sm">${initials(p.name)}</span>${esc(p.name)}<span>${esc(p.role)}</span></li>`).join("");
      if (open && matches[hi]) owner.setAttribute("aria-activedescendant", "opt-" + matches[hi].id); else owner.removeAttribute("aria-activedescendant");
    };
    const accept = p => {
      ownerId = p.id; owner.value = p.name; matches = []; drawMenu();
      $("#h-owner").textContent = linked(p.id) ? "" : "Not connected to Slack";
      $("#h-owner").className = "hint" + (linked(p.id) ? "" : " bad");
      owner.removeAttribute("aria-invalid");
    };
    const dueDate = () => parseDue(due.value);
    const showDue = () => {
      const h = $("#h-due"), d = dueDate();
      if (!due.value.trim()) { h.textContent = ""; h.className = "hint"; due.removeAttribute("aria-invalid"); return; }
      if (d) { h.textContent = `${fmtLong(d)} · ${inWords(d)}`; h.className = "hint ok"; due.removeAttribute("aria-invalid"); }
      else { h.textContent = "Try fri, 12/4, next week or +3d"; h.className = "hint bad"; }
    };
    const resolveOwner = () => {
      if (ownerId) return true;
      const c = candidates(owner.value);
      if (owner.value.trim() && c.length === 1) { accept(c[0]); return true; }
      return false;
    };
    const advance = () => {
      if (!title.value.trim()) { title.focus(); $("#h-title").textContent = "Type the action item first"; $("#h-title").className = "hint bad"; return; }
      if (!resolveOwner()) { owner.focus(); owner.setAttribute("aria-invalid", owner.value.trim() ? "true" : "false"); $("#h-owner").textContent = owner.value.trim() ? "Pick someone from the list" : ""; $("#h-owner").className = "hint bad"; matches = candidates(owner.value); hi = 0; drawMenu(); return; }
      const d = dueDate();
      if (!d) { due.focus(); if (due.value.trim()) due.setAttribute("aria-invalid", "true"); showDue(); return; }
      const v = viewer(), p = person(ownerId);
      const t = { id: "t" + state.next, order: state.next, title: title.value.trim(), ownerId, due: iso(d), status: "todo",
        teamId: p.team || null, meetingId: "m0", notes: "", creatorId: v.id, undelivered: false };
      state.next++;
      state.tasks.push(t); save();
      freshId = t.id; renderItems();
      title.value = ""; owner.value = ""; due.value = ""; ownerId = null;
      ["#h-title", "#h-owner", "#h-due"].forEach(s => { $(s).textContent = ""; $(s).className = "hint"; });
      title.focus();
      toast(`Added "${t.title}"`, [dm(p.id, `new task, due ${fmtLong(d)}`)]);
    };

    form.addEventListener("submit", e => { e.preventDefault(); advance(); });
    title.addEventListener("input", () => { $("#h-title").textContent = ""; $("#h-title").className = "hint"; });
    title.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); advance(); } });
    due.addEventListener("input", showDue);
    due.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); advance(); } });
    owner.addEventListener("focus", () => { matches = ownerId ? [] : candidates(owner.value); hi = 0; drawMenu(); });
    owner.addEventListener("input", () => { ownerId = null; $("#h-owner").textContent = ""; $("#h-owner").className = "hint"; owner.removeAttribute("aria-invalid"); matches = candidates(owner.value); hi = 0; drawMenu(); });
    owner.addEventListener("keydown", e => {
      const open = !menu.hidden && matches.length;
      if (e.key === "ArrowDown" && open) { e.preventDefault(); hi = (hi + 1) % matches.length; drawMenu(); }
      else if (e.key === "ArrowUp" && open) { e.preventDefault(); hi = (hi - 1 + matches.length) % matches.length; drawMenu(); }
      else if (e.key === "Enter") { e.preventDefault(); if (open && owner.value.trim()) { accept(matches[hi]); } advance(); }
      else if (e.key === "Tab" && open && owner.value.trim()) { accept(matches[hi]); }
      else if (e.key === "Escape" && open) { e.preventDefault(); matches = []; drawMenu(); }
    });
    owner.addEventListener("blur", () => { setTimeout(() => { resolveOwner(); matches = []; drawMenu(); }, 120); });
    menu.addEventListener("mousedown", e => {
      const li = e.target.closest("li[data-id]");
      if (!li) return;
      e.preventDefault(); accept(person(li.dataset.id)); due.focus();
    });
    renderItems();
  }

    const dueIn = $("#s-due");
    if (dueIn) {
      const show = () => { const d = parseDue(dueIn.value), h = $("#sh-due"); if (!dueIn.value.trim()) { h.textContent = ""; h.className = "hint"; return; } h.textContent = d ? `${fmtLong(d)} · ${inWords(d)}` : "Try fri, 12/4, next week or +3d"; h.className = "hint " + (d ? "ok" : "bad"); };
      dueIn.addEventListener("input", show);
    }
    sheet.showModal();
    const f = $("#s-title"); if (f && isNew) f.focus();
  }
  function saveSheet() {
    const v = viewer(), t = sheetTask, isNew = !t.id;
    const canD = isNew || canEditDetails(v, t);
    const notes = [];
    let next = { ...t };
    if (canD) {
      const title = $("#s-title").value.trim(), ownerId = $("#s-owner").value, d = parseDue($("#s-due").value);
      let bad = false;
      if (!title) { $("#sh-title").textContent = "Give the task a title"; $("#sh-title").className = "hint bad"; bad = true; }
      if (!ownerId) { $("#sh-owner").textContent = "Pick an owner"; $("#sh-owner").className = "hint bad"; bad = true; }
      if (!d) { $("#sh-due").textContent = "Type a due date, like fri or 12/4"; $("#sh-due").className = "hint bad"; bad = true; }
      if (bad) return;
      Object.assign(next, { title, ownerId, due: iso(d), teamId: $("#s-team").value || null, meetingId: $("#s-meeting").value || null, notes: $("#s-notes").value.trim() });
    }
    const st = $("#s-status"); if (st) next.status = st.value;

    if (isNew) {
      next.id = "t" + state.next; next.order = state.next; state.next++;
      state.tasks.push(next);
      notes.push(dm(next.ownerId, `new task, due ${fmtLong(fromIso(next.due))}`));
      toast(`Added "${next.title}"`, notes);
    } else {
      if (next.ownerId !== t.ownerId) {
        notes.push(dm(next.ownerId, "it's assigned to them now"));
        if (!person(t.ownerId).former) notes.push(dm(t.ownerId, "it's no longer theirs"));
      } else if (next.due !== t.due && next.status !== "done") {
        notes.push(dm(next.ownerId, `due date moved from ${fmtLong(fromIso(t.due))} to ${fmtLong(fromIso(next.due))}`));
      }
      if (next.status === "done" && t.status !== "done") notes.push("Marked done. Reminders for this task stop.");
      if (next.due !== t.due || next.ownerId !== t.ownerId) next.undelivered = false;
      Object.assign(t, next);
      toast("Saved", notes);
      next = t;
    }
    save(); sheet.close(); freshId = next.id; render();
  }

  sheet.addEventListener("submit", e => { e.preventDefault(); saveSheet(); });
  sheet.addEventListener("click", e => {
    const a = e.target.closest("[data-action]");
    if (e.target === sheet) { sheet.close(); return; }
    if (!a) return;
    const act = a.dataset.action;
    if (act === "close") sheet.close();
    if (act === "ask-delete") {
      $("#sheet-foot").innerHTML = `<div class="confirm"><p><b>Delete "${esc(sheetTask.title)}"?</b> It's removed for everyone and its reminders stop. This can't be undone.</p>
        <div style="display:flex;gap:8px"><button class="btn btn-danger" type="button" data-action="do-delete">Delete task</button><button class="btn btn-outline" type="button" data-action="close">Keep it</button></div></div>`;
    }
    if (act === "do-delete") {
      state.tasks = state.tasks.filter(x => x.id !== sheetTask.id); save(); sheet.close();
      toast(`Deleted "${sheetTask.title}"`); render();
    }
  });

  /* ---------- Page-level events ---------- */
  const view = $("#view");
  view.addEventListener("click", e => {
    const a = e.target.closest("[data-action]");
    if (!a || a.tagName === "SELECT") return;
    const act = a.dataset.action, id = a.dataset.id;
    if (act === "open") openSheet(id);
    else if (act === "new") openSheet(null);
    else if (act === "group") { ui.groupBy = a.dataset.v; save(); render(); }
    else if (act === "mine") { ui.mine = !ui.mine; save(); render(); }
    else if (act === "done") { ui.showDone = !ui.showDone; save(); render(); }
    else if (act === "big") { ui.big = !ui.big; save(); a.setAttribute("aria-pressed", ui.big); $(".entry").classList.toggle("big", ui.big); }
    else if (act === "remove") {
      const t = state.tasks.find(x => x.id === id);
      state.tasks = state.tasks.filter(x => x.id !== id); save(); renderItems();
      toast(`Removed "${t.title}"`);
      $("#e-title")?.focus();
    }
    else if (act === "edit-link") { editing = id; setupError = ""; render(); $(`#slack-${id}`)?.focus(); }
    else if (act === "cancel-link") { editing = null; setupError = ""; render(); }
    else if (act === "unlink") { delete state.slack[id]; save(); render(); toast(`Unlinked ${person(id).name}`, [`${first(person(id))} won't get reminders until they're linked again.`]); }
  });
  view.addEventListener("change", e => {
    const s = e.target.closest("select[data-action='status']");
    if (!s) return;
    const t = state.tasks.find(x => x.id === s.dataset.id);
    const was = t.status;
    t.status = s.value; save();
    s.className = `status s-${t.status}`;
    toast(`${STATUS[t.status]}: ${t.title}`, t.status === "done" ? ["Reminders for this task stop."] : was === "done" ? ["Reminders pick up again from the due date."] : []);
    if (route() === "board" && (t.status === "done" || was === "done")) setTimeout(render, 300);
  });
  view.addEventListener("submit", e => {
    const f = e.target.closest("form[data-form]");
    if (!f) return;
    e.preventDefault();
    if (f.dataset.form === "link") {
      const id = f.dataset.id, val = f.querySelector("input").value.trim().toUpperCase();
      if (!/^[UW][A-Z0-9]{8,11}$/.test(val)) { setupError = "Member IDs look like U07ABC1234"; render(); $(`#slack-${id}`)?.focus(); return; }
      state.slack[id] = val; editing = null; setupError = ""; save(); render();
      toast(`Linked ${person(id).name}`, [`${first(person(id))} gets reminders from the next one on.`]);
    }
    if (f.dataset.form === "summary") {
      state.summary = { day: +$("#sum-day").value, hour: +$("#sum-hour").value }; save(); render();
      toast("Saved", [`Next summary: ${fmtLong(nextSummary())} at ${hourLabel(state.summary.hour)}, to ${SUPERS.map(first).join(", ").replace(/, ([^,]*)$/, " and $1")}.`]);
    }
  });

  $("#viewer").addEventListener("change", e => { ui.viewer = e.target.value; ui.mine = false; editing = null; save(); render(); });
  $("#reset").addEventListener("click", () => { state = seed(); editing = null; save(); render(); toast("Sample data reset"); });

  /* ---------- Routing ---------- */
  const ROUTES = { meeting: renderMeeting, board: renderBoard, home: renderHome, dms: renderDms, setup: renderSetup };
  const route = () => { const h = location.hash.replace("#", ""); return ROUTES[h] ? h : "meeting"; };
  function render() {
    const r = route();
    renderChrome(r);
    view.innerHTML = ROUTES[r]();
    if (r === "meeting") wireEntry();
    freshId = null;
  }
  window.addEventListener("hashchange", () => { editing = null; render(); window.scrollTo(0, 0); });
  render();
})();
</script>
